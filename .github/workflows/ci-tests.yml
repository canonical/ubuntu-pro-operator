name: Run Tests

on:
  workflow_call:

jobs:
  test:
    name: Run Tests
    # Pinned to 24.04 (Python 3.12): unit-old uses ops 1.x, which imports `cgi`, removed in
    # Python 3.13, so it breaks on newer runners such as ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install tox
        run: sudo apt-get update && sudo apt-get install -y tox
      
      - name: Run linting
        run: tox run -e lint
      
      - name: Run unit tests
        run: tox run -e unit,unit-old
