name: Release ubuntu-pro-operator to latest/edge

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    uses: ./.github/workflows/ci-tests.yml

  release:
    name: Build and Release ubuntu-pro-operator
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      matrix:
        include:
          # Current multi-base track (24.04 + 26.04) needs charmcraft 4.x.
          - build-target: ubuntu-pro
            charmcraft-channel: 4.x/stable
          # Old track (bases: 16.04-22.04) stays on charmcraft 3.x.
          - build-target: ubuntu-pro_old
            charmcraft-channel: 3.x/stable
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup LXD
        uses: canonical/setup-lxd@v0.1.3
        with:
          channel: latest/stable

      - name: Install charmcraft
        run: sudo snap install charmcraft --classic --channel=${{ matrix.charmcraft-channel }}

      # A single `charmcraft pack` can produce several .charm files (one per
      # base), so upload and release every artifact that is produced.
      - name: Build ${{ matrix.build-target }}
        run: make ${{ matrix.build-target }}

      - name: Upload and release every packed artifact
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
          # charmcraft 4.x crashes with "Project not configured yet" when
          # `charmcraft upload` runs outside a directory containing
          # charmcraft.yaml (canonical/charmcraft#2492). The Makefile removes
          # charmcraft.yaml after packing, so restore it here before uploading.
          # (charmcraft 3.x is unaffected; restoring the file is harmless there.)
        run: |
          cp charms/${{ matrix.build-target }}/charmcraft.yaml .
          for charm in *.charm; do
            echo "Uploading and releasing ${charm}"
            charmcraft upload "${charm}" --release latest/edge
          done
          rm -f charmcraft.yaml
