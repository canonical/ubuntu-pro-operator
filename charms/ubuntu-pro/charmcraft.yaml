type: charm
links:
  issues: https://github.com/canonical/ubuntu-pro-operator/issues
  source: https://github.com/canonical/ubuntu-pro-operator
subordinate: true
requires:
  juju-info:
    interface: juju-info
    scope: container

name: ubuntu-pro
summary: This charm enables Ubuntu Pro (https://ubuntu.com/pro) subscriptions.
description: |
  This charm enables Ubuntu Pro subscriptions on a principal charm using the ubuntu-pro-client.

platforms:
  ubuntu-24.04-amd64:
    build-on: [ubuntu@24.04:amd64]
    build-for: [ubuntu@24.04:amd64]
  ubuntu-24.04-arm64:
    build-on: [ubuntu@24.04:arm64]
    build-for: [ubuntu@24.04:arm64]
  ubuntu-26.04-amd64:
    build-on: [ubuntu@26.04:amd64]
    build-for: [ubuntu@26.04:amd64]
  ubuntu-26.04-arm64:
    build-on: [ubuntu@26.04:arm64]
    build-for: [ubuntu@26.04:arm64]

parts:
  charm:
    plugin: python
    source: .
    python-requirements:
      - requirements.txt
